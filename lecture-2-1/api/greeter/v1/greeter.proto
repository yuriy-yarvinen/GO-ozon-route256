syntax = "proto3";

package greeter.v1;

option go_package = "gitlab.ozon.dev/go/classroom-8/students/lecture-2-1/gen/greeter/v1;greeterv1";

service Greeter {
  rpc SayHello(SayHelloRequest) returns (SayHelloResponse);
}

message SayHelloRequest {
  string name = 10;
  string ggg = 11;
}

message SayHelloResponse {
  string message = 10;
  string message2 = 11;
}
