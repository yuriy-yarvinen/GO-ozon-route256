syntax = "proto3";

package examples.googlecommontypes.v1;

option go_package = "gitlab.ozon.dev/go/classroom-8/students/lecture-2-1/gen/examples/googlecommontypes;googlecommontypes";

import "google/type/calendar_period.proto";
import "google/type/color.proto";
import "google/type/date.proto";
import "google/type/dayofweek.proto";
import "google/type/decimal.proto";
import "google/type/expr.proto";
import "google/type/fraction.proto";
import "google/type/latlng.proto";
import "google/type/localized_text.proto";
import "google/type/money.proto";
import "google/type/month.proto";
import "google/type/phone_number.proto";
import "google/type/postal_address.proto";
import "google/type/timeofday.proto";

message GoogleCommonTypesExample {
  google.type.Date date = 1;
  google.type.Money price = 2;
  google.type.PostalAddress address = 3;
  google.type.Color color = 4;
  google.type.PhoneNumber phone_number = 5;
  google.type.LocalizedText localized_text = 6;
  google.type.LatLng location = 7;
  google.type.DayOfWeek day_of_week = 8;
  google.type.Month month = 9;
  google.type.TimeOfDay time_of_day = 10;
  google.type.Fraction fraction = 11;
  google.type.Decimal decimal = 12;
  google.type.Expr expression = 13;
  google.type.CalendarPeriod calendar_period = 14;
}
